replicaCount: 2

image:
  repository: ghcr.io/shubhxmpxtil/server-health-api
  tag: v0.1.0
  pullPolicy: IfNotPresent

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  host: sha.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10

preStopSleepSeconds: 5
